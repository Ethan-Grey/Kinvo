name: Deploy Supabase

# Applies new database migrations and redeploys Edge Functions whenever a
# merge to main changes them. The web app is deployed separately by Vercel.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch: # "Run workflow" button, e.g. after adding the secrets

# Never run two deploys at once, and never cancel one halfway through.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Migrations and functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Not secret: it's part of the project's public URL.
      PROJECT_REF: odyvgnlofdtbaqvopupn
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

    steps:
      - name: Check secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD under Settings → Secrets and variables → Actions (docs/setup.md, section 7)."
            exit 1
          fi

      - uses: actions/checkout@v7

      # Same Supabase CLI version as CI and local development (package-lock.json).
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link project
        run: npx supabase link --project-ref "$PROJECT_REF"

      - name: Show pending migrations
        run: npx supabase migration list

      - name: Apply migrations
        run: npx supabase db push

      - name: Deploy Edge Functions
        run: npx supabase functions deploy --project-ref "$PROJECT_REF"
