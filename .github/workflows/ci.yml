name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel an older run on the same branch when new commits are pushed.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Web app checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fails on known high or critical vulnerabilities in what ships to users.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # Use the Supabase CLI version pinned in package-lock.json, so CI and
      # local development always run the same version.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local database
        run: npx supabase db start

      - name: Lint SQL
        run: npx supabase db lint --level error

      - name: Row Level Security and function tests (pgTAP)
        run: npx supabase test db

  functions:
    name: Edge Function checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: supabase/functions

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Deno runs through npx so no extra setup action (or GitHub API call) is needed.
      - name: Type check
        run: npx --yes deno@2 check send-notifications/index.ts _shared/*.ts

      - name: Unit tests
        run: npx --yes deno@2 test _shared/
