# Weekly dependency update PRs. Minor and patch updates are grouped into one PR
# per ecosystem so they're quick to review; major updates get their own PR.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Pacific/Auckland
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned until typescript-eslint supports TypeScript 7 (see apps/web/package.json).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Node's types should match the Node version we run (22, see CI and
      # "engines"), not the newest release, or code could use APIs we don't have.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Pacific/Auckland
    commit-message:
      prefix: ci(deps)
    groups:
      actions:
        patterns: ['*']
